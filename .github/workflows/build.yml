name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -f Dockerfile ]; then echo "hay=si" >> $GITHUB_OUTPUT
          else echo "hay=no" >> $GITHUB_OUTPUT; echo "Sin Dockerfile todavía (Fase 1)."; fi
      - uses: docker/login-action@v3
        if: steps.guard.outputs.hay == 'si'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.guard.outputs.hay == 'si'
        with:
          context: .
          push: true
          # El SHA completo es la referencia que se despliega. El tag móvil
          # :staging existe para mirar, NUNCA para desplegar.
          tags: |
            ghcr.io/voxtilabs/xhub:${{ github.sha }}
            ghcr.io/voxtilabs/xhub:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
