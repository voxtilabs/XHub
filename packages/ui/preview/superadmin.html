<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>xHub · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/tokens.css">
<style>
  *{box-sizing:border-box} body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--fuente);min-height:100vh}
  .top{display:flex;align-items:center;gap:.6rem;padding:1.2rem 2rem;border-bottom:1px solid var(--borde)}
  .punto{width:9px;height:9px;border-radius:50%;background:var(--accion);box-shadow:0 0 10px var(--accion)}
  .top b{font-weight:600;letter-spacing:-.02em;font-size:1.2rem}
  .top .tag{margin-left:.5rem;color:var(--senal);font-size:.65rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--borde);padding:.15rem .5rem;border-radius:var(--radio-pill)}
  .wrap{padding:2rem;max-width:1100px;margin:0 auto}
  .kpis{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
  .kpi{flex:1;min-width:180px;background:var(--vidrio);border:1px solid var(--borde);border-radius:var(--radio-lg);padding:1.2rem}
  .kpi .n{font-size:2.2rem;font-weight:600;letter-spacing:-.03em}
  .kpi .l{color:var(--senal);font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  h2{font-weight:600;letter-spacing:-.02em;font-size:1.1rem;margin:0 0 1rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--texto-2);font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:.6rem .8rem;border-bottom:1px solid var(--borde)}
  td{padding:.9rem .8rem;border-bottom:1px solid var(--borde);font-size:.95rem}
  .badge{font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:var(--radio-pill);border:1px solid var(--borde)}
  .b-exito{color:var(--exito)} .b-senal{color:var(--senal)} .b-accion{color:var(--accion)} .b-neutro{color:var(--texto-2)}
  .chip{display:inline-block;font-size:.72rem;color:var(--senal);border:1px solid var(--borde);border-radius:var(--radio-pill);padding:.12rem .5rem;margin-right:.3rem}
  .bar{height:6px;background:var(--superficie-2);border-radius:99px;overflow:hidden;margin-top:.3rem;width:120px}
  .bar>i{display:block;height:100%;border-radius:99px}
  .fill-ok{background:var(--senal)} .fill-aviso{background:var(--accion)} .fill-exc{background:var(--accion)}
  .bp{background:var(--accion);color:var(--texto-accion);border:none;border-radius:var(--radio-pill);height:2.6rem;padding:0 1.2rem;font-weight:600;font-family:var(--fuente);cursor:pointer;font-size:.9rem}
  .row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .mono{font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="top"><span class="punto"></span><b>xHub</b><span class="tag">Superadmin · X5</span></div>
  <div class="wrap">
    <div class="kpis">
      <div class="kpi"><div class="l">Clientes</div><div class="n">3</div></div>
      <div class="kpi"><div class="l">Activos</div><div class="n">2</div></div>
      <div class="kpi"><div class="l">En alerta de cuota</div><div class="n" style="color:var(--accion)">1</div></div>
    </div>
    <div class="row-top"><h2>Clientes</h2><button class="bp">+ Crear cliente</button></div>
    <table>
      <thead><tr><th>Cliente</th><th>Estado</th><th>Módulos</th><th>Consumo API (mes)</th></tr></thead>
      <tbody>
        <tr>
          <td>Retail Andes SpA</td>
          <td><span class="badge b-exito">activo</span></td>
          <td><span class="chip">tickets</span><span class="chip">crm</span></td>
          <td class="mono">4.210 / 50.000<div class="bar"><i class="fill-ok" style="width:8%"></i></div></td>
        </tr>
        <tr>
          <td>Clínica Costanera</td>
          <td><span class="badge b-exito">activo</span></td>
          <td><span class="chip">tickets</span></td>
          <td class="mono">9.100 / 10.000<div class="bar"><i class="fill-aviso" style="width:91%"></i></div></td>
        </tr>
        <tr>
          <td>Automotriz del Sur</td>
          <td><span class="badge b-accion">moroso</span></td>
          <td><span class="chip">crm</span></td>
          <td class="mono">0 / 10.000<div class="bar"><i class="fill-ok" style="width:0%"></i></div></td>
        </tr>
      </tbody>
    </table>
  </div>
</body></html>
